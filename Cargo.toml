[package]
name = "npm_packager"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "stream"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
url = "2"
chrono = "0.4"
zip = "0.6"
walkdir = "2"
indicatif = "0.17"
clap = { version = "4.4", features = ["derive"] }
sha2 = "0.10"
base64 = "0.21"

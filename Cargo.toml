[package]
name = "npm_packager"
version = "0.1.0"
edition = "2021"
authors = ["Meubli <meublikoo@gmail.com>"]
license = "MIT"
description = "High-performance CLI tool for downloading and packaging npm dependencies in parallel"
repository = "https://github.com/Meubli/npm_packager"
readme = "README.md"
keywords = ["npm", "download", "cli", "parallel"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "stream", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
url = "2"
chrono = "0.4"
zip = "0.6"
walkdir = "2"
indicatif = "0.17"
clap = { version = "4.4", features = ["derive"] }
sha2 = "0.10"
base64 = "0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

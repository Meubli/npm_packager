name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux GNU builds
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            
          # Linux musl builds
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          
          # macOS builds
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          
          # Windows build
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross
      
      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash
      
      - name: Create Archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p npm_packager-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/npm_packager npm_packager-${{ matrix.target }}/
          cp README.md LICENSE ARCHITECTURE.md npm_packager-${{ matrix.target }}/
          tar czf npm_packager-${{ matrix.target }}.tar.gz npm_packager-${{ matrix.target }}/
          ls -lh npm_packager-${{ matrix.target }}.tar.gz
        shell: bash
      
      - name: Create Archive (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir npm_packager-${{ matrix.target }}
          copy target\${{ matrix.target }}\release\npm_packager.exe npm_packager-${{ matrix.target }}\
          copy README.md npm_packager-${{ matrix.target }}\
          copy LICENSE npm_packager-${{ matrix.target }}\
          powershell Compress-Archive -Path npm_packager-${{ matrix.target }} -DestinationPath npm_packager-${{ matrix.target }}.zip
          dir npm_packager-${{ matrix.target }}.zip
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: npm_packager-${{ matrix.target }}
          path: |
            npm_packager-${{ matrix.target }}.tar.gz
            npm_packager-${{ matrix.target }}.zip
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      
      - name: Prepare artifacts
        run: |
          mkdir -p release_files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release_files/ \;
          ls -lh release_files/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

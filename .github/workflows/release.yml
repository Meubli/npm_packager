name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux GNU builds
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            
          # Linux musl builds
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          
          # macOS builds
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          
          # Windows build
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross
      
      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash
      
      - name: Create Archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p npm_packager-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/npm_packager npm_packager-${{ matrix.target }}/
          cp README.md LICENSE ARCHITECTURE.md npm_packager-${{ matrix.target }}/
          tar czf npm_packager-${{ matrix.target }}.tar.gz npm_packager-${{ matrix.target }}/
          ls -lh npm_packager-${{ matrix.target }}.tar.gz
        shell: bash
      
      - name: Create Archive (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir npm_packager-${{ matrix.target }}
          copy target\${{ matrix.target }}\release\npm_packager.exe npm_packager-${{ matrix.target }}\
          copy README.md npm_packager-${{ matrix.target }}\
          copy LICENSE npm_packager-${{ matrix.target }}\
          powershell Compress-Archive -Path npm_packager-${{ matrix.target }} -DestinationPath npm_packager-${{ matrix.target }}.zip
          dir npm_packager-${{ matrix.target }}.zip

      - name: Upload Release Asset (Unix)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: npm_packager-${{ matrix.target }}.tar.gz
          asset_name: npm_packager-${{ matrix.target }}.tar.gz
          asset_content_type: application/gzip
        if: runner.os != 'Windows'
      
      - name: Upload Release Asset (Windows)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: npm_packager-${{ matrix.target }}.zip
          asset_name: npm_packager-${{ matrix.target }}.zip
          asset_content_type: application/zip
        if: runner.os == 'Windows'
